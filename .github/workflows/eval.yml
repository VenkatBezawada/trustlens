name: RAG Eval Gate

# Runs the real retrieval-quality gate on every change that could affect it —
# a PR that regresses chunking, retrieval, or generation gets blocked here,
# not caught later by a user noticing a wrong answer.
#
# workflow_dispatch is included so this can be triggered manually from the
# GitHub Actions tab — useful for demoing the gate without needing an actual PR.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Build vector index from committed chunks
        # data/processed/chunks.jsonl is tracked in git (see .gitignore); the
        # index itself (.chroma/, bm25.pkl) is NOT — it's derived data, rebuilt
        # fresh here every run rather than committing binary artifacts.
        run: |
          export PYTHONPATH=src
          python -m trustlens.index

      - name: Run eval (real gate if a key is configured, free dry-run otherwise)
        # No OPENAI_API_KEY secret required for this repo to work. If none is
        # set, this automatically falls back to --dry-run (real, deterministic
        # retrieval metrics; generation/correctness metrics report N/A — see
        # eval/run_eval.py's docstring). Add an OPENAI_API_KEY repo secret
        # later (Settings -> Secrets and variables -> Actions) to upgrade this
        # to the real, paid gate with no other changes needed — same workflow,
        # same command, it just detects the key and switches modes.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          export PYTHONPATH=.:src
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "No OPENAI_API_KEY secret configured -- running in free dry-run mode."
            python -m eval.run_eval --dry-run
          else
            echo "OPENAI_API_KEY found -- running the real, paid eval gate."
            python -m eval.run_eval --backend openai --gate
          fi

      - name: Upload eval report
        # Keeps the full per-question JSON attached to the run even when the
        # gate fails, so a failure can be diagnosed from the Actions tab
        # without needing to reproduce it locally first.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/*.json
