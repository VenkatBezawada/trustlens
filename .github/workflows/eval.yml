name: RAG Eval Gate

# Runs the real retrieval-quality gate on every change that could affect it —
# a PR that regresses chunking, retrieval, or generation gets blocked here,
# not caught later by a user noticing a wrong answer.
#
# workflow_dispatch is included so this can be triggered manually from the
# GitHub Actions tab — useful for demoing the gate without needing an actual PR.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Build vector index from committed chunks
        # data/processed/chunks.jsonl is tracked in git (see .gitignore); the
        # index itself (.chroma/, bm25.pkl) is NOT — it's derived data, rebuilt
        # fresh here every run rather than committing binary artifacts.
        run: |
          export PYTHONPATH=src
          python -m trustlens.index

      - name: Run eval gate (free recall-only gate by default, full paid gate if a key is configured)
        # No OPENAI_API_KEY secret required for this repo to enforce a real gate:
        # context_recall is deterministic (pure chunk-ID overlap, no LLM involved),
        # so it's checked EVERY run, key or no key — a genuine retrieval regression
        # fails this CI check for free. Only the correctness/success-rate half of
        # the gate needs a real judge call, and that half is skipped (not silently
        # passed) when no key is present — see apply_gate() in eval/run_eval.py.
        # Add an OPENAI_API_KEY repo secret later (Settings -> Secrets and
        # variables -> Actions) to upgrade to the full gate — same workflow, same
        # command, it just detects the key and checks both halves.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          export PYTHONPATH=.:src
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "No OPENAI_API_KEY secret configured -- running free dry-run gate (context_recall only)."
            python -m eval.run_eval --dry-run --gate
          else
            echo "OPENAI_API_KEY found -- running the full, paid eval gate."
            python -m eval.run_eval --backend openai --gate
          fi

      - name: Upload eval report
        # Keeps the full per-question JSON attached to the run even when the
        # gate fails, so a failure can be diagnosed from the Actions tab
        # without needing to reproduce it locally first.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/*.json
